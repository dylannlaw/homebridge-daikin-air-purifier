# Every push to master that raises the version in package.json publishes that version to npm, tags it
# and creates a GitHub Release whose notes are the version's entry in CHANGELOG.md.
#
# Version: package.json is the source of truth, so the repository always says what is on npm. A pull
# request that changes the plugin must raise the version and add a CHANGELOG.md entry; tests.yml checks
# that with .github/scripts/check-version.sh. CI never edits or commits the version.
#
# Authentication: npm trusted publishing (OIDC) when it is set up for this repository on npmjs.com,
# otherwise the NPM_TOKEN secret (a granular access token that can bypass 2FA).
#
# Security (the repo is public, so pull requests can come from anyone):
# - This workflow only runs on pushes to master, never on pull requests, so fork code never sees secrets.
# - The test job only reads the repo. Only the release job can write, and only its publish step gets
#   the npm token.
# - Third-party actions are pinned to a commit SHA. Dependabot proposes updates.
name: Release

# A release happens when package.json has a version that isn't on npm yet. The paths below are a first
# filter (a version bump always touches package.json). The plugin files are listed too, so a plugin
# change that reached master without a version bump fails the "changes" job loudly instead of being
# skipped. .github/scripts/should-release.sh decides what counts as a plugin change; keep the two in
# step. workflow_dispatch publishes the current version if it isn't on npm yet.
on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "config.schema.json"
      - "tsconfig.json"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, in push order, so versions are published in the order the commits landed.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  changes:
    name: Check for a new version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit before the push, to diff against
          persist-credentials: false

      - name: Is there a new version to release?
        id: check
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            # Already published. Fine if this push raised the version (a re-run of its release) or didn't
            # change the plugin; an error if the plugin changed without a version bump.
            OLD=$(git show "$BEFORE:package.json" 2> /dev/null | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version' 2> /dev/null || true)
            if [ "$EVENT" != "workflow_dispatch" ] && [ "$OLD" = "$VERSION" ] &&
              bash .github/scripts/should-release.sh "$BEFORE" | tee check.log | grep -qx 'release=true'; then
              cat check.log
              echo "::error file=package.json::The plugin changed but $VERSION is already on npm. Raise the version" \
                "in package.json and add a CHANGELOG.md entry in a pull request."
              exit 1
            fi
            echo "$NAME@$VERSION is already on npm, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never publish a version lower than the latest one, which would move users backwards.
          LATEST=$(npm view "$NAME" dist-tags.latest 2>/dev/null || echo 0.0.0)
          if [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error file=package.json::$VERSION is lower than $LATEST on npm."
            exit 1
          fi

          ESCAPED=${VERSION//./\\.}
          if ! grep -Eq "^#{2,3} \[$ESCAPED\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no entry for $VERSION."
            exit 1
          fi

          echo "Releasing $NAME@$VERSION (latest on npm is $LATEST)."
          echo "release=true" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    uses: ./.github/workflows/tests.yml

  release:
    name: Publish to npm
    needs: [changes, test]
    if: needs.changes.outputs.release == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the tag and GitHub Release
      id-token: write # npm trusted publishing and provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (no token) needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs lint, build and the tests again on the exact files being published.
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # gh creates the tag through the API on the commit that was built, so no git credentials are needed.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 0
          fi
          # The notes are this version's CHANGELOG.md entry, without its heading.
          awk -v v="$VERSION" '
            /^#{2,3} \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file notes.md \
            --latest
